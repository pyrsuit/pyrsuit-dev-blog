[project]
site_name = "The Python Pursuit"
site_url = "https://pyrsuit.dev/"
site_description = "All things Python."
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Blog" = "blog/index.md" },
  { "Tags" = "tags.md" },
  { "Contact" = "contact.md" },
]
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
favicon = "assets/favicon.png"
custom_dir = "overrides"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.indexes",
  "navigation.instant",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.font]
text = "Montserrat"

[[project.theme.palette]]
scheme = "default"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pyrsuit"
name = "GitHub"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tasklist.custom_checkbox = true

# One blog; every post is tagged TIL or Lab. post_url_format = "{slug}" gives /blog/<slug>/.
[[project.plugins]]
[project.plugins.blog]
blog_dir = "blog"
post_url_format = "{slug}"
post_date_format = "long"
pagination_per_page = 10
archive = false
categories = false
# Every post needs a <!-- more --> marker; the index shows only the part above it.
post_excerpt = "required"
# Posts with `draft: true` show up in `zensical serve` but are left out of `zensical build`.
draft = false
draft_on_serve = true

[[project.plugins]]
[project.plugins.tags]
# Every post has one type tag (TIL or Lab) plus topic tags from this list.
tags_allowed = [
  "TIL", "Lab",
  "AI agents", "Compilers", "Concurrency", "Conferences", "Databases", "IoT",
  "Language features", "Local LLMs", "Messaging", "Observability", "Open source",
  "Packaging", "Performance", "Security", "Testing", "Tooling",
]

[[project.plugins]]
[project.plugins.rss]
match_path = "blog/posts/.*"
date_from_meta = { as_creation = "date" }
use_git = false
feed_title = "The Python Pursuit"
feed_description = "All things Python."
feeds_filenames = { json_created = "feed.json", rss_created = "feed.xml", json_updated = "feed_updated.json", rss_updated = "feed_updated.xml" }

# Keep the old /til/<slug>/ and /lab/<slug>/ URLs working.
[[project.plugins]]
[project.plugins.redirects.redirect_maps]
"index.md" = "blog/index.md"
"lab/a_cookbook_for_a_weather_station_part_1.md" = "blog/posts/a_cookbook_for_a_weather_station_part_1.md"
"lab/a_cookbook_for_a_weather_station_part_2.md" = "blog/posts/a_cookbook_for_a_weather_station_part_2.md"
"lab/amqp_0_9_1_vs_1_0.md" = "blog/posts/amqp_0_9_1_vs_1_0.md"
"til/api-vs-abi.md" = "blog/posts/api-vs-abi.md"
"til/catching-malware-before-install.md" = "blog/posts/catching-malware-before-install.md"
"til/compile-me.md" = "blog/posts/compile-me.md"
"lab/europython_wasm_compiler.md" = "blog/posts/europython_wasm_compiler.md"
"til/goodbye-temp-venv-hacks.md" = "blog/posts/goodbye-temp-venv-hacks.md"
"lab/local_shopping_agent.md" = "blog/posts/local_shopping_agent.md"
"lab/mellum2_local_coding_agent.md" = "blog/posts/mellum2_local_coding_agent.md"
"lab/no_gil_no_cry.md" = "blog/posts/no_gil_no_cry.md"
"til/non-public-vs-protected.md" = "blog/posts/non-public-vs-protected.md"
"til/prometheus-multiprocess-apps-a-lesson-from-the-trenches.md" = "blog/posts/prometheus-multiprocess-apps-a-lesson-from-the-trenches.md"
"lab/qwen2_coder_local_setup.md" = "blog/posts/qwen2_coder_local_setup.md"
"til/the-one-when-truncate-locked-me-out.md" = "blog/posts/the-one-when-truncate-locked-me-out.md"
"til/walrus-operator-assign-on-the-fly.md" = "blog/posts/walrus-operator-assign-on-the-fly.md"
"lab/week_planner_agent.md" = "blog/posts/week_planner_agent.md"
"til/when-metrics-eat-your-memory.md" = "blog/posts/when-metrics-eat-your-memory.md"
"lab/when_in_bologna.md" = "blog/posts/when_in_bologna.md"
"lab/when_in_bologna_on_message_brokers.md" = "blog/posts/when_in_bologna_on_message_brokers.md"
"til/index.md" = "blog/index.md"
"lab/index.md" = "blog/index.md"
